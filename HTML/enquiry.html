<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiries | Bean & Bite Bakery</title>

    <meta name="description" content="Send Bean & Bite Bakery an enquiry about products, services, volunteering or sponsorship.">

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>
        <h1>Bean & Bite Bakery</h1>
    </header>

    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Contact us about our products, services,
                volunteering opportunities or sponsorship.
            </p>
<form id="enquiry-form" action="#" method="post">

    <label for="enquiry-name">Full Name:</label>
    <input type="text" id="enquiry-name" name="name" required>

    <label for="enquiry-email">Email Address:</label>
    <input type="email" id="enquiry-email" name="email" required>

    <label for="enquiry-type">Enquiry Type:</label>
    <select id="enquiry-type" name="enquiry-type" required>
        <option value="">Select an enquiry type</option>
        <option value="products">Products</option>
        <option value="services">Services</option>
        <option value="volunteering">Volunteering</option>
        <option value="sponsorship">Sponsorship</option>
    </select>

    <label for="enquiry-message">Your Enquiry:</label>
    <textarea id="enquiry-message" name="message" required minlength="10"></textarea>

    <button type="submit">Submit Enquiry</button>

</form>
<p id="enquiry-response" aria-live="polite"></p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Bean & Bite Bakery. All rights reserved.</p>
    </footer>

</body>
<script src="../JAVASCRIPT/javascript.js"></script>
</html>
